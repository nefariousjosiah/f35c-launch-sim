name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  launchsim:
    name: Launch physics tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false  # the physics tests need no binary assets
      - name: Configure
        run: cmake -S SimTests -B SimTests/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build SimTests/build --config Release --parallel
      - name: Test
        run: ctest --test-dir SimTests/build -C Release --output-on-failure
