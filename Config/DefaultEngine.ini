; Rendering defaults chosen for photographic daylight at sea.
; See Docs/RenderSettings.md for the reasoning behind each value.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/F35CLaunch.F35CLaunchGameMode
EditorStartupMap=/Game/Maps/LaunchTest.LaunchTest
GameDefaultMap=/Game/Maps/LaunchTest.LaunchTest

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DX12 + Shader Model 6 is required for hardware ray tracing and Nanite.
; (Several UE 5.5 issues are Vulkan-specific; stay on DX12.)
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Fully dynamic lighting: Lumen GI + reflections, no baked lightmaps.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1

; Hardware ray tracing is compiled in so the Movie Render Queue profile can use it.
; Real-time play uses software Lumen (faster on an RX 6650 XT); final frames switch to HWRT.
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=False

; Physical camera exposure. Extended luminance range must be enabled before any
; look-dev: switching it later changes what every existing exposure value means.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=True

; Let the Sky Atmosphere drive the height fog colour (marine haze).
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True

; Temporal Super Resolution, tuned for RDNA's packed 16-bit maths.
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=True
r.VirtualTextures=True

[/Script/Engine.Engine]
NearClipPlane=5.0

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.CollisionProfile]
; The launch physics runs in LaunchSim, not Chaos; nothing project-specific yet.
